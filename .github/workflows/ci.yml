name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/*.test.mjs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.285
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/elladex --strict
      - run: claude plugin validate plugins/elladex-agx --strict

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: for f in examples/two-claudes/*.sh; do bash -n "$f"; done
      - run: node --check examples/two-claudes/story.mjs
      - run: node --test examples/two-claudes/*.test.mjs
      - run: node --test examples/two-claudes/templates/berlin-carrier/test/*.test.mjs
      - run: python3 -c "import json; json.load(open('examples/team-setup/.claude/settings.json'))"
