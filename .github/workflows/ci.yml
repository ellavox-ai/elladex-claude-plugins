name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The plugin directory accepts these only from Verified organizations.
  directory-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Only Markdown, JSON, PNG and LICENSE files in the plugins
        run: |
          bad=$(find plugins -type f ! -name '*.md' ! -name '*.json' ! -name '*.png' ! -name LICENSE)
          [ -z "$bad" ] || { echo "::error::files the directory refuses:"; echo "$bad"; exit 1; }
      - name: No hooks, plugin dependencies or allowed-tools grants
        run: |
          ! find plugins -name hooks.json | grep . || { echo "::error::hooks.json found"; exit 1; }
          ! grep -l '"dependencies"' plugins/*/.claude-plugin/plugin.json || { echo "::error::plugin dependencies found"; exit 1; }
          ! grep -rlE '^allowed-?[tT]ools:' plugins || { echo "::error::allowed-tools found; the directory accepts only Read, Grep, Glob and LS"; exit 1; }

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.285
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/elladex --strict
      - run: claude plugin validate plugins/elladex-agx --strict

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: for f in examples/two-claudes/*.sh; do bash -n "$f"; done
      - run: node --check examples/two-claudes/story.mjs
      - run: node --test examples/two-claudes/*.test.mjs
      - run: node --test examples/two-claudes/templates/berlin-carrier/test/*.test.mjs
      - run: python3 -c "import json; json.load(open('examples/team-setup/.claude/settings.json'))"
