name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test plugins/elladex-agx/scripts/*.test.mjs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.285
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/elladex --strict
      - run: claude plugin validate plugins/elladex-agx --strict
